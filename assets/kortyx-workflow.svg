<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Kortyx: explicit workflows, inspectable execution</title>
  <desc id="desc">Conceptual workflow: a request enters a workflow that can call a model or pause for human input, then streams a response. Runtime state supports persistence, and Studio receives telemetry.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111e30"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="18" fill="url(#background)" stroke="#27364a"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="44" y="58" fill="#5eead4" font-size="16" font-weight="600" letter-spacing="3">KORTYX / WORKFLOW CONCEPT</text>
    <text x="44" y="105" fill="#f1f5f9" font-size="32" font-weight="600" letter-spacing="-.5">Explicit workflows. Inspectable execution.</text>
    <g fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)">
      <path d="M232 224H290"/>
      <path d="M482 224H516Q528 224 528 212V185Q528 175 540 175H592"/>
      <path d="M482 224H516Q528 224 528 236V263Q528 275 540 275H592"/>
      <path d="M812 175H858Q870 175 870 187V212Q870 224 882 224H930"/>
      <path d="M812 275H858Q870 275 870 263V236Q870 224 882 224H930"/>
    </g>
    <g fill="#18283c" stroke="#3b526b">
      <rect x="44" y="190" width="188" height="68" rx="12"/>
      <rect x="296" y="190" width="186" height="68" rx="12" stroke="#5eead4"/>
      <rect x="598" y="143" width="214" height="64" rx="12"/>
      <rect x="598" y="243" width="214" height="64" rx="12"/>
      <rect x="936" y="190" width="220" height="68" rx="12"/>
    </g>
    <g fill="#e2e8f0" font-size="23" text-anchor="middle">
      <text x="138" y="233">Request</text>
      <text x="389" y="233" fill="#99f6e4">Workflow</text>
      <text x="705" y="183">Model call</text>
      <text x="705" y="283">Human input</text>
      <text x="1046" y="233">Stream response</text>
    </g>
    <path d="M44 340H1156" stroke="#2c4055"/>
    <circle cx="54" cy="381" r="4" fill="#5eead4"/>
    <text x="70" y="387" fill="#aebdd0" font-size="19">Persistent runtime state</text>
    <circle cx="480" cy="381" r="4" fill="#5eead4"/>
    <text x="496" y="387" fill="#aebdd0" font-size="19">Streaming events</text>
    <circle cx="856" cy="381" r="4" fill="#5eead4"/>
    <text x="872" y="387" fill="#aebdd0" font-size="19">Studio telemetry</text>
  </g>
</svg>
